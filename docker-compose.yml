services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gzavnili
      POSTGRES_PASSWORD: gzavnili
      POSTGRES_DB: gzavnili
    ports:
      - '5432:5432'
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data

