services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gzavnili
      POSTGRES_PASSWORD: gzavnili
      POSTGRES_DB: gzavnili
    ports:
      - '5432:5432'
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data

  # BullMQ (docs/decisions/0004-scheduled-jobs.md) — job queue for the Phase 6 cron
  # migration's "needs retries/backpressure" jobs (SMS sends). Plain redis:7, no modules.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker/data/redis:/data
